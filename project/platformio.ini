; PlatformIO build, upload and dependency settings.
; https://docs.platformio.org/page/projectconf.html

; pin the Seeed platform and select the Sense board's Arduino framework.
[env:seeed_xiao_nrf52840_sense]
platform = https://github.com/Seeed-Studio/platform-seeedboards.git#fe48609c542e3c66173def2e89ca1fb92058300d
board = seeed-xiao-afruitnrf52-nrf52840-sense
framework = arduino
; match USB diagnostics and RTC provisioning.
monitor_speed = 115200
; embed weather before upload, then set and verify the RTC after flashing.
extra_scripts =
    pre:tools/platformio_weather.py
    post:tools/platformio_rtc.py
; pin all five selected external libraries.
lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX.git#0dfdd7135425be82b5bb4b4b58d74dd51ab29a59
    https://github.com/Seeed-Studio/Seeed_Arduino_RoundDisplay.git#e811877f5b150981a481c39abd9c7ee0a029cd1c
    lvgl/lvgl@9.6.0
    bblanchon/ArduinoJson@7.4.3
    adafruit/RTClib@2.1.4
; exclude competing display drivers and unused examples.
lib_ignore =
    TFT_eSPI
    GFX Library for Arduino
    lv_examples
    AnimatedGIF
; apply the shared LVGL configuration and Round Display wiring.
build_flags =
    -D LV_CONF_SKIP
    -include include/lv_conf.h
    -D USER_SETUP_LOADED
    ; configure the 240-pixel round panel.
    -D GC9A01_DRIVER
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    ; use XIAO pin numbers for SPI, control and backlight signals.
    -D TFT_MOSI=10
    -D TFT_MISO=9
    -D TFT_SCLK=8
    -D TFT_CS=1
    -D TFT_DC=3
    -D TFT_RST=-1
    -D TFT_BL=6
    -D TFT_BACKLIGHT_ON=1
    ; preserve the validated SPI write/read frequencies.
    -D SPI_FREQUENCY=8000000
    -D SPI_READ_FREQUENCY=4000000
